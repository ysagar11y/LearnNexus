name: learnnexus

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnnexus-postgres
    environment:
      POSTGRES_DB: learnnexus
      POSTGRES_USER: learnnexus
      POSTGRES_PASSWORD: learnnexus
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnnexus -d learnnexus"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: learnnexus-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: learnnexus-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: learnnexus
      MINIO_ROOT_PASSWORD: learnnexus-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: learnnexus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 learnnexus learnnexus-secret &&
      mc mb --ignore-existing local/learnnexus-media &&
      mc anonymous set download local/learnnexus-media/public &&
      echo 'MinIO bucket ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: learnnexus-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:
  minio-data:
