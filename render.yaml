# Render Blueprint — deploys the API as a Docker web service on Render's free
# plan. Open https://dashboard.render.com/blueprints, "New Blueprint
# Instance", point it at this repo, and Render reads this file.
#
# Postgres is deliberately NOT declared here as a Render-managed database.
# Render's free Postgres plan is deleted after a fixed trial window; Neon's
# free tier has no such expiry. Point DB_URL at Neon instead — see
# docs/DEPLOYMENT.md for the five-minute signup.
#
# Object storage (S3/R2) and outbound email are configured but not required:
# nothing in the UI uploads media, and certificate PDFs render on demand
# rather than being read back from storage, so the app is fully usable with
# both left at their defaults. See docs/DEPLOYMENT.md if you want either.

services:
  - type: web
    name: learnnexus-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Generated by Render at first deploy — 32+ random characters, which is
      # what JwtService requires. Never set this to a fixed value in a
      # blueprint that might be reused across deployments.
      - key: JWT_SECRET
        generateValue: true

      - key: SEED_ENABLED
        value: "true"
      - key: MAIL_ENABLED
        value: "false"

      # Filled in from the dashboard after the Neon signup in
      # docs/DEPLOYMENT.md — `sync: false` means Render prompts for a value
      # instead of taking one from this file, so nothing goes to a public
      # remote in plaintext.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Filled in once the frontend has a URL (chicken-and-egg with the
      # frontend's own VITE_API_BASE_URL — see the deployment guide for the
      # order to do this in).
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

      # Left at the local-dev defaults on purpose. See the file header.
      - key: S3_ENDPOINT
        value: http://localhost:9000
      - key: S3_PUBLIC_ENDPOINT
        value: http://localhost:9000
