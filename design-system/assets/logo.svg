<!-- LearnNexus lockup: mark + wordmark.
     The wordmark splits weight rather than colour — "Learn" in regular,
     "Nexus" in semibold. Two-tone colour wordmarks date badly and fight
     with per-tenant theming; a weight split never does. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 32" fill="none"
     width="200" height="32" role="img" aria-label="LearnNexus">
  <g>
    <path d="M4 24 L11.5 16.5 L17 20.5 L23.5 8.5"
          stroke="currentColor" stroke-width="2.3"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
    <circle cx="4"    cy="24"   r="2.9" fill="currentColor" opacity="0.55"/>
    <circle cx="11.5" cy="16.5" r="2.9" fill="currentColor" opacity="0.75"/>
    <circle cx="23.5" cy="8.5"  r="3.7" fill="currentColor"/>
  </g>
  <text x="36" y="22"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18.5" letter-spacing="-0.4" fill="currentColor">
    <tspan font-weight="400">Learn</tspan><tspan font-weight="600">Nexus</tspan>
  </text>
</svg>
