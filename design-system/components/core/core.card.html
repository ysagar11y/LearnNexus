<!-- @dsCard group="Components" viewport="860x300" name="Core" subtitle="Card, StatTile, Avatar, Progress, ProgressRing, Separator" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  .co { padding: 26px; background: var(--background); font-family: var(--font-sans);
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: start; }
  .lbl { font-size: var(--text-2xs); letter-spacing:.06em; text-transform:uppercase;
         font-weight:600; color:var(--muted-foreground); margin-bottom:10px; }
  .tile { display:flex; flex-direction:column; gap:12px; padding:20px; background:var(--card);
          border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }
  .tile-lab { font-size:var(--text-xs); font-weight:500; letter-spacing:.02em; color:var(--muted-foreground); }
  .tile-val { font-family:var(--font-display); font-size:var(--text-3xl); font-weight:400;
              letter-spacing:var(--tracking-display); line-height:1; font-variant-numeric:tabular-nums; }
  .av { display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
        font-weight:600;font-size:12px;box-shadow:inset 0 0 0 1px oklch(.5 .02 250 / .08) }
</style>

<div class="co">
  <div>
    <div class="lbl">StatTile</div>
    <div class="tile">
      <div class="tile-lab">Active learners</div>
      <div style="display:flex;align-items:baseline;gap:8px">
        <span class="tile-val">1,284</span>
        <span style="display:inline-flex;align-items:center;gap:3px;font-size:var(--text-xs);
                     font-weight:500;color:var(--success)">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 2 L8.5 7 L1.5 7 Z" fill="currentColor"/></svg>
          12%</span>
      </div>
      <span style="font-size:var(--text-xs);color:var(--muted-foreground)">vs. last 30 days</span>
    </div>
  </div>

  <div>
    <div class="lbl">StatTile · negative</div>
    <div class="tile">
      <div class="tile-lab">Overdue</div>
      <div style="display:flex;align-items:baseline;gap:8px">
        <span class="tile-val">37</span>
        <span style="display:inline-flex;align-items:center;gap:3px;font-size:var(--text-xs);
                     font-weight:500;color:var(--destructive)">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 2 L8.5 7 L1.5 7 Z" fill="currentColor"/></svg>
          8%</span>
      </div>
      <span style="font-size:var(--text-xs);color:var(--muted-foreground)">needs attention</span>
    </div>
  </div>

  <div>
    <div class="lbl">ProgressRing</div>
    <div class="tile" style="align-items:center">
      <div style="position:relative;width:84px;height:84px">
        <svg width="84" height="84" style="transform:rotate(-90deg)">
          <circle cx="42" cy="42" r="38" fill="none" stroke="var(--muted)" stroke-width="7"/>
          <circle cx="42" cy="42" r="38" fill="none" stroke="var(--primary)" stroke-width="7"
                  stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="83.6"/></svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
          <span style="font-size:23px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums">
            65<span style="font-size:.6em;font-weight:500">%</span></span>
        </div>
      </div>
      <span style="font-size:var(--text-xs);color:var(--muted-foreground)">Org completion</span>
    </div>
  </div>

  <div>
    <div class="lbl">Avatar · Progress</div>
    <div class="tile">
      <div style="display:flex;align-items:center">
        <span class="av" style="width:32px;height:32px;background:oklch(.88 .055 84);color:oklch(.34 .09 84);
                                box-shadow:0 0 0 2px var(--card)">PR</span>
        <span class="av" style="width:32px;height:32px;margin-left:-10px;background:oklch(.88 .055 196);
                                color:oklch(.34 .09 196);box-shadow:0 0 0 2px var(--card)">AK</span>
        <span class="av" style="width:32px;height:32px;margin-left:-10px;background:oklch(.88 .055 312);
                                color:oklch(.34 .09 312);box-shadow:0 0 0 2px var(--card)">MJ</span>
        <span class="av" style="width:32px;height:32px;margin-left:-10px;background:var(--muted);
                                color:var(--muted-foreground);box-shadow:0 0 0 2px var(--card)">+9</span>
      </div>
      <div style="height:1px;background:var(--border)"></div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:var(--text-xs);margin-bottom:6px">
          <span style="color:var(--muted-foreground)">Module 2</span>
          <span style="font-weight:500">40%</span></div>
        <div style="height:7px;background:var(--track);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:40%;background:var(--primary);border-radius:99px"></div></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:var(--text-xs);margin-bottom:6px">
          <span style="color:var(--muted-foreground)">Module 1</span>
          <span style="font-weight:500;color:var(--success)">100%</span></div>
        <div style="height:7px;background:var(--track);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:100%;background:var(--success);border-radius:99px"></div></div>
      </div>
    </div>
  </div>
</div>
