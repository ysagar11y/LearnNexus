server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  tomcat:
    max-http-form-post-size: 2MB

spring:
  application:
    name: learnnexus-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/learnnexus}
    username: ${DB_USER:learnnexus}
    password: ${DB_PASSWORD:learnnexus}
    hikari:
      pool-name: learnnexus-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 4
      connection-timeout: 10000
      max-lifetime: 900000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        # Fail loudly instead of silently emitting a query per row.
        globally_quoted_identifiers: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  # A comma-separated env var binds straight to List<String>: Spring's
  # StringToCollectionConverter splits it. Kept as a single scalar (rather than
  # a YAML list bound from one var) so one env var is enough in every
  # deployment target's dashboard.
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

  jwt:
    # Overridden in every deployed environment; the default only exists so a
    # fresh clone boots without configuration.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdefghijklmnop}
    issuer: learnnexus
    access-token-ttl: 30m
    refresh-token-ttl: 30d

  tenancy:
    root-domain: ${TENANT_ROOT_DOMAIN:learnnexus.app}
    system-slug: platform
    header-override: X-Tenant

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:learnnexus-media}
    access-key: ${S3_ACCESS_KEY:learnnexus}
    secret-key: ${S3_SECRET_KEY:learnnexus-secret}
    path-style-access: true
    presign-ttl: 15m
    max-upload-bytes: 536870912

  mail:
    enabled: ${MAIL_ENABLED:true}
    from-address: ${MAIL_FROM:no-reply@learnnexus.app}
    from-name: LearnNexus

  seed:
    enabled: ${SEED_ENABLED:true}
    demo-password: ${SEED_PASSWORD:Learn@2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    # The Redis starter is on the classpath for future caching work, but
    # nothing in the codebase talks to Redis yet (no RedisTemplate, no
    # @Cacheable). Without this, a deployment target's health check can be
    # gated on a Redis instance the app does not actually need — including,
    # today, none being provisioned at all.
    redis:
      enabled: false
    # Spring Boot's built-in mail health indicator pings the configured SMTP
    # host on every /actuator/health call, independently of app.mail.enabled
    # above — so turning our own flag off (the norm when no SMTP relay is
    # configured, e.g. this free deployment) leaves health permanently DOWN
    # even though the app is serving requests correctly. "Can I reach the
    # mail relay right now" and "is the app healthy" are different questions;
    # MailService already logs a send failure where it is actually actionable.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.learnnexus: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
